<!DOCTYPE html>
<html>
<head>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-sans,sans-serif)}
body{background:var(--color-background-tertiary,#f5f5f3);color:var(--color-text-primary,#111);min-height:100vh;padding:1rem}
h1{font-size:18px;font-weight:500;margin-bottom:1rem;text-align:center}
.panel{background:var(--color-background-primary,#fff);border:0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.15));border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
canvas{display:block;width:100%;border-radius:8px;background:#0a0a1a;cursor:ew-resize}
.sliders{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:1rem}
.slider-group{display:flex;flex-direction:column;gap:4px}
.slider-group label{font-size:12px;color:var(--color-text-secondary,#888)}
.slider-row{display:flex;align-items:center;gap:8px}
.slider-row input[type=range]{flex:1}
.slider-val{font-size:13px;font-weight:500;min-width:52px;text-align:right}
.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:1rem}
.input-group{display:flex;flex-direction:column;gap:4px}
.input-group label{font-size:12px;color:var(--color-text-secondary,#888)}
.input-group input{padding:6px 10px;border:0.5px solid var(--color-border-secondary,rgba(0,0,0,0.3));border-radius:8px;font-size:14px;background:var(--color-background-primary,#fff);color:var(--color-text-primary,#111);width:100%}
.input-group input.correct{border-color:#1d9e75;background:#e1f5ee}
.input-group input.wrong{border-color:#e24b4a;background:#fcebeb}
.btn-row{display:flex;gap:10px;margin-top:1rem;flex-wrap:wrap}
button{padding:8px 18px;border:0.5px solid var(--color-border-secondary,rgba(0,0,0,0.3));border-radius:8px;background:transparent;color:var(--color-text-primary,#111);font-size:14px;cursor:pointer}
button:hover{background:var(--color-background-secondary,#f1efe8)}
button:active{transform:scale(0.98)}
#feedback{margin-top:0.75rem;font-size:14px;min-height:20px;font-weight:500}
.feedback-ok{color:#0f6e56}
.feedback-err{color:#a32d2d}
.harmonic-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:0.5rem}
.h-btn{padding:5px 12px;border-radius:8px;font-size:13px;border:0.5px solid var(--color-border-tertiary,rgba(0,0,0,0.15))}
.h-btn.active{background:#1d9e75;color:#fff;border-color:#0f6e56}
.scenario-info{font-size:13px;color:var(--color-text-secondary,#888);margin-top:0.5rem}
.divider{height:0.5px;background:var(--color-border-tertiary,rgba(0,0,0,0.12));margin:1rem 0}
.hint{font-size:12px;color:var(--color-text-secondary,#888);margin-top:0.75rem}
</style>
</head>
<body>
<h1>Standing Waves on a String</h1>

<div class="panel">
  <canvas id="c" height="180"></canvas>
  <p class="hint">Drag the left wall to change length · Press on the string to force a harmonic node</p>
  <div class="sliders">
    <div class="slider-group">
      <label>Length (m)</label>
      <div class="slider-row">
        <input type="range" id="sL" min="0.5" max="3.0" step="0.05" value="1.5">
        <span class="slider-val" id="vL">1.50</span>
      </div>
    </div>
    <div class="slider-group">
      <label>Hanging mass (kg)</label>
      <div class="slider-row">
        <input type="range" id="sM" min="0.05" max="1.00" step="0.01" value="0.30">
        <span class="slider-val" id="vM">0.30</span>
      </div>
    </div>
    <div class="slider-group">
      <label>Linear density (g/m)</label>
      <div class="slider-row">
        <input type="range" id="sU" min="1" max="25" step="0.5" value="8.0">
        <span class="slider-val" id="vU">8.0</span>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div style="font-size:13px;color:var(--color-text-secondary,#888);margin-bottom:4px">Select harmonic:</div>
  <div class="harmonic-btns" id="hbtns"></div>
  <p class="scenario-info" id="info"></p>
  <div class="divider"></div>
  <div class="inputs">
    <div class="input-group">
      <label>Velocity (m/s)</label>
      <input type="number" id="inV" placeholder="e.g. 24.0">
    </div>
    <div class="input-group">
      <label>Wavelength (m)</label>
      <input type="number" id="inW" placeholder="e.g. 1.50">
    </div>
    <div class="input-group">
      <label>Frequency (Hz)</label>
      <input type="number" id="inF" placeholder="e.g. 16.0">
    </div>
  </div>
  <div id="feedback"></div>
  <div class="btn-row">
    <button onclick="check()">Check answers</button>
    <button onclick="reveal()">Show answers</button>
    <button onclick="randomize()">Randomize</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const g = 9.8;
const L_MIN=0.5, L_MAX=3.0, MU_MIN=0.001, MU_MAX=0.025;

let L=1.5, mass=0.30, mu=0.008, n=1;
let v, lam, freq, animT=0, raf;

// dragging state
let draggingWall=false, wallDragStartX=0, wallDragStartL=0;
// harmonic touch state
let touchingString=false, forcedN=null, prevN=null;

function compute(){
  v=Math.sqrt(mass*g/mu); lam=2*L/n; freq=v/lam;
}

function rand(a,b,dp){return parseFloat((Math.random()*(b-a)+a).toFixed(dp));}

function randomize(){
  L=rand(0.5,3.0,2); mass=rand(0.05,1.00,2); mu=rand(MU_MIN,MU_MAX,3); n=Math.floor(Math.random()*5)+1;
  document.getElementById('sL').value=L;
  document.getElementById('sM').value=mass;
  document.getElementById('sU').value=(mu*1000).toFixed(1);
  document.getElementById('vL').textContent=L.toFixed(2);
  document.getElementById('vM').textContent=mass.toFixed(2);
  document.getElementById('vU').textContent=(mu*1000).toFixed(1);
  rebuildHButtons(); clearInputs(); document.getElementById('feedback').textContent=''; update();
}

function update(){
  compute();
  document.getElementById('info').textContent=`Find the wave speed, wavelength, and frequency for harmonic #${n}.`;
  clearInputs(); document.getElementById('feedback').textContent='';
}

function rebuildHButtons(){
  const c=document.getElementById('hbtns'); c.innerHTML='';
  for(let i=1;i<=6;i++){
    const b=document.createElement('button');
    b.className='h-btn'+(i===n?' active':'');
    b.textContent=`n = ${i}`;
    b.onclick=()=>{ n=i; document.querySelectorAll('.h-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); update(); };
    c.appendChild(b);
  }
}

function clearInputs(){
  ['inV','inW','inF'].forEach(id=>{const el=document.getElementById(id);el.value='';el.className='';});
}

function tol(u,a){return Math.abs(u-a)/a<0.02;}

function check(){
  const uV=parseFloat(document.getElementById('inV').value);
  const uW=parseFloat(document.getElementById('inW').value);
  const uF=parseFloat(document.getElementById('inF').value);
  let ok=0,total=0;
  [['inV',uV,v],['inW',uW,lam],['inF',uF,freq]].forEach(([id,u,a])=>{
    const el=document.getElementById(id);
    if(!isNaN(u)){total++;const c=tol(u,a);el.className=c?'correct':'wrong';if(c)ok++;}
  });
  const fb=document.getElementById('feedback');
  if(total===0){fb.textContent='Enter at least one answer.';fb.className='feedback-err';return;}
  fb.textContent=ok===total?`All ${ok} answer${ok>1?'s':''} correct!`:`${ok} of ${total} correct.`;
  fb.className=ok===total?'feedback-ok':'feedback-err';
}

function reveal(){
  document.getElementById('inV').value=v.toFixed(3);
  document.getElementById('inW').value=lam.toFixed(3);
  document.getElementById('inF').value=freq.toFixed(3);
  ['inV','inW','inF'].forEach(id=>document.getElementById(id).className='correct');
  document.getElementById('feedback').textContent='Answers revealed.';
  document.getElementById('feedback').className='feedback-ok';
}

// Layout helpers
function getLayout(){
  const W=canvas.offsetWidth||700, H=180;
  const lFrac=(L-L_MIN)/(L_MAX-L_MIN);
  const rightX=W-100, totalTrack=rightX-40;
  const strW=Math.round(totalTrack*(0.18+lFrac*0.82));
  const leftX=rightX-strW;
  const midY=H/2-10;
  return{W,H,leftX,rightX,strW,midY};
}

function getClientXY(e){
  if(e.touches&&e.touches.length>0)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length>0)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}

// Convert canvas-space x to fraction along string
function xToStringFrac(cx){
  const {leftX,strW}=getLayout();
  return Math.max(0,Math.min(1,(cx-leftX)/strW));
}

// Given a press fraction along string, find closest harmonic (1-6) and snap node
function snapToHarmonic(frac){
  // For harmonic n, nodes are at positions k/n for k=0..n
  // Internal nodes (k=1..n-1) are the touchable ones
  let bestN=1, bestDist=Infinity, bestNodeFrac=null;
  for(let ni=1;ni<=6;ni++){
    for(let k=1;k<ni;k++){
      const nodeFrac=k/ni;
      const dist=Math.abs(frac-nodeFrac);
      if(dist<bestDist){bestDist=dist;bestN=ni;bestNodeFrac=nodeFrac;}
    }
  }
  return{harmonicN:bestN,nodeFrac:bestNodeFrac};
}

// Wall drag
function onCanvasDown(e){
  const {x:ex,y:ey}=getClientXY(e);
  const rect=canvas.getBoundingClientRect();
  const dpr=devicePixelRatio||1;
  const cx=(ex-rect.left)*(canvas.width/rect.width)/dpr;
  const cy=(ey-rect.top)*(canvas.height/rect.height)/dpr;
  const {leftX,midY,strW}=getLayout();

  // Check if near left wall (within 16px)
  if(Math.abs(cx-leftX)<16){
    draggingWall=true; wallDragStartX=cx; wallDragStartL=L;
    canvas.style.cursor='ew-resize';
    e.preventDefault(); return;
  }

  // Check if on string (within 24px vertically, within string x range)
  const {rightX}=getLayout();
  if(Math.abs(cy-midY)<24 && cx>leftX && cx<rightX && !draggingWall){
    touchingString=true;
    prevN=n;
    const frac=xToStringFrac(cx);
    const {harmonicN}=snapToHarmonic(frac);
    forcedN=harmonicN; n=harmonicN;
    document.querySelectorAll('.h-btn').forEach((b,i)=>b.classList.toggle('active',i+1===n));
    compute();
    e.preventDefault();
  }
}

function onCanvasMove(e){
  const {x:ex}=getClientXY(e);
  const rect=canvas.getBoundingClientRect();
  const dpr=devicePixelRatio||1;
  const cx=(ex-rect.left)*(canvas.width/rect.width)/dpr;

  if(draggingWall){
    const {W,rightX}=getLayout();
    const totalTrack=rightX-40;
    const dxFrac=(wallDragStartX-cx)/totalTrack;
    const dL=dxFrac*(L_MAX-L_MIN)*0.82;
    L=Math.max(L_MIN,Math.min(L_MAX,wallDragStartL+dL));
    document.getElementById('sL').value=L;
    document.getElementById('vL').textContent=L.toFixed(2);
    compute(); e.preventDefault();
  }
}

function onCanvasUp(e){
  if(draggingWall){ draggingWall=false; canvas.style.cursor='ew-resize'; }
  if(touchingString){
    touchingString=false;
    n=prevN; forcedN=null;
    document.querySelectorAll('.h-btn').forEach((b,i)=>b.classList.toggle('active',i+1===n));
    compute();
  }
}

canvas.addEventListener('mousedown',onCanvasDown);
canvas.addEventListener('mousemove',onCanvasMove);
canvas.addEventListener('mouseup',onCanvasUp);
canvas.addEventListener('mouseleave',onCanvasUp);
canvas.addEventListener('touchstart',onCanvasDown,{passive:false});
canvas.addEventListener('touchmove',onCanvasMove,{passive:false});
canvas.addEventListener('touchend',onCanvasUp);

function draw(){
  const dpr=devicePixelRatio||1;
  const {W,H,leftX,rightX,strW,midY}=getLayout();
  canvas.width=W*dpr; canvas.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);

  const wallW=14, py=20, strH=H-py*2-20, amp=strH*0.38;
  const muFrac=(mu-MU_MIN)/(MU_MAX-MU_MIN);
  const stringThick=1.5+muFrac*5.5;

  ctx.fillStyle='#0a0a1a'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2a2a4a'; ctx.lineWidth=0.5;
  for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Dead zone fill left of wall
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,leftX,H);

  // Left wall
  ctx.fillStyle='#3a3a5a';
  ctx.fillRect(leftX-wallW,py,wallW,strH);
  ctx.fillStyle='#555';
  for(let y2=py+6;y2<py+strH;y2+=10) ctx.fillRect(leftX-wallW+2,y2,wallW-4,4);
  // Drag handle highlight
  ctx.strokeStyle='rgba(100,180,255,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(leftX,py); ctx.lineTo(leftX,py+strH); ctx.stroke();

  // Right wall
  ctx.fillStyle='#3a3a5a'; ctx.fillRect(rightX,py,wallW,strH);
  ctx.fillStyle='#555';
  for(let y2=py+6;y2<py+strH;y2+=10) ctx.fillRect(rightX+2,y2,wallW-4,4);

  const displayN = forcedN!==null ? forcedN : n;
  const t=animT;
  const pts=250;

  const drawWave=(phase,color,alpha,glow,lw)=>{
    ctx.save();
    ctx.shadowColor='rgba(100,200,255,0.5)'; ctx.shadowBlur=glow?12:0;
    ctx.strokeStyle=color; ctx.lineWidth=lw; ctx.globalAlpha=alpha;
    ctx.beginPath();
    for(let i=0;i<=pts;i++){
      const x=leftX+strW*i/pts, frc=i/pts;
      const y=midY+amp*Math.sin(displayN*Math.PI*frc)*Math.cos(t+phase);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.restore();
  };
  drawWave(Math.PI,'rgba(80,160,255,1)',0.12,false,stringThick*0.6);
  drawWave(0,'rgba(120,200,255,1)',0.18,false,stringThick*0.8);
  drawWave(0,'#7ddcff',1,true,stringThick);

  // Nodes
  ctx.fillStyle='#ff6060';
  for(let i=0;i<=displayN;i++){
    const x=leftX+strW*i/displayN;
    ctx.beginPath(); ctx.arc(x,midY,4,0,Math.PI*2); ctx.fill();
  }
  // Antinodes
  ctx.fillStyle='#ffdd60';
  for(let i=0;i<displayN;i++){
    const x=leftX+strW*(i+0.5)/displayN;
    ctx.beginPath(); ctx.arc(x,midY,3,0,Math.PI*2); ctx.fill();
  }

  // Finger touch indicator when forcing harmonic
  if(forcedN!==null && touchingString){
    ctx.fillStyle='rgba(255,140,0,0.85)';
    ctx.strokeStyle='#ffaa00'; ctx.lineWidth=1.5;
    // highlight all internal nodes
    for(let k=1;k<forcedN;k++){
      const x=leftX+strW*k/forcedN;
      ctx.beginPath(); ctx.arc(x,midY,7,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x,midY,7,0,Math.PI*2); ctx.stroke();
    }
  }

  // Hanging mass & rope
  const ropeX=rightX+wallW;
  const bw=24+mass*40, bh=18+mass*20;
  ctx.strokeStyle='#aaa'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(ropeX,midY); ctx.lineTo(ropeX+14,midY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ropeX+14,midY-10); ctx.lineTo(ropeX+14,midY+10); ctx.stroke();
  const bx=ropeX+14-bw/2, by=midY+10;
  ctx.fillStyle='#5a4a30'; ctx.strokeStyle='#888'; ctx.lineWidth=1;
  ctx.fillRect(bx,by,bw,bh); ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  ctx.fillText(mass.toFixed(2)+'kg',ropeX+14,by+bh/2+4);

  // Labels
  ctx.fillStyle='rgba(200,200,255,0.5)'; ctx.font='11px sans-serif'; ctx.textAlign='left';
  ctx.fillText(`L = ${L.toFixed(2)} m`,leftX+4,py-5);
  ctx.fillStyle='rgba(100,180,255,0.65)'; ctx.textAlign='center';
  const dispN=forcedN!==null?forcedN:n;
  ctx.fillText(`n = ${dispN}  (${dispN} loop${dispN>1?'s':''})  |  μ = ${(mu*1000).toFixed(1)} g/m  |  ${freq.toFixed(1)} Hz`,leftX+strW/2,H-6);

  const angularFreq=2*Math.PI*freq;
  animT+=angularFreq*0.002;
  raf=requestAnimationFrame(draw);
}

// Slider listeners
document.getElementById('sL').oninput=e=>{
  L=parseFloat(e.target.value);
  document.getElementById('vL').textContent=L.toFixed(2);
  update();
};
document.getElementById('sM').oninput=e=>{
  mass=parseFloat(e.target.value);
  document.getElementById('vM').textContent=mass.toFixed(2);
  update();
};
document.getElementById('sU').oninput=e=>{
  mu=parseFloat(e.target.value)/1000;
  document.getElementById('vU').textContent=parseFloat(e.target.value).toFixed(1);
  update();
};

rebuildHButtons(); compute();
document.getElementById('info').textContent=`Find the wave speed, wavelength, and frequency for harmonic #${n}.`;
draw();
window.addEventListener('resize',()=>{cancelAnimationFrame(raf);draw();});
</script>
</body>
</html>
