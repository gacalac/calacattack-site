<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Electron Shuffle</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #f5f5f5; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
  h1 { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #222; }
  .controls { display: flex; gap: 20px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  .ctrl-group { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .ctrl-group label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.05em; }
  .btn-row { display: flex; gap: 5px; }
  button { padding: 5px 12px; border: 2px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 500; color: #444; transition: all 0.15s; }
  button.active-green { border-color: #3a9c5a; background: #3a9c5a; color: #fff; }
  button.active-purple { border-color: #7c5cbf; background: #7c5cbf; color: #fff; }
  button:hover:not(.active-green):not(.active-purple) { border-color: #888; }
  .info-box { font-size: 12px; color: #555; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 7px 14px; margin-bottom: 8px; text-align: center; line-height: 1.7; max-width: 680px; }
  .info-box span { font-weight: 600; color: #222; }
  svg { width: 100%; max-width: 720px; }
  .divider { width: 1px; background: #ddd; margin: 0 4px; }
</style>
</head>
<body>
<h1>Electron Shuffle — Circuit Model</h1>

<div class="controls">
  <!-- Battery count -->
  <div class="ctrl-group">
    <label>Batteries</label>
    <div class="btn-row" id="battBtns">
      <button onclick="setBatt(1)" id="b1" class="active-green">1</button>
      <button onclick="setBatt(2)" id="b2">2</button>
      <button onclick="setBatt(3)" id="b3">3</button>
    </div>
  </div>
  <!-- Battery config -->
  <div class="ctrl-group" id="battConfigGroup" style="visibility:hidden">
    <label>Battery Config</label>
    <div class="btn-row">
      <button onclick="setBattConfig('parallel')" id="cBPar" class="active-green">Parallel</button>
      <button onclick="setBattConfig('series')" id="cBSer">Series</button>
    </div>
  </div>
  <div class="divider"></div>
  <!-- Bulb count -->
  <div class="ctrl-group">
    <label>Bulbs</label>
    <div class="btn-row">
      <button onclick="setBulb(1)" id="l1" class="active-purple">1</button>
      <button onclick="setBulb(2)" id="l2">2</button>
      <button onclick="setBulb(3)" id="l3">3</button>
    </div>
  </div>
  <!-- Bulb config -->
  <div class="ctrl-group" id="bulbConfigGroup" style="visibility:hidden">
    <label>Bulb Config</label>
    <div class="btn-row">
      <button onclick="setBulbConfig('series')" id="cLSer" class="active-purple">Series</button>
      <button onclick="setBulbConfig('parallel')" id="cLPar">Parallel</button>
    </div>
  </div>
</div>

<div class="info-box" id="infoBox"></div>
<div id="svgContainer"></div>

<script>
let numBatt = 1, battConfig = 'parallel';
let numBulb = 1, bulbConfig = 'series';

function setBatt(n) {
  numBatt = n;
  ['b1','b2','b3'].forEach(id => document.getElementById(id).classList.remove('active-green'));
  document.getElementById('b'+n).classList.add('active-green');
  document.getElementById('battConfigGroup').style.visibility = n === 1 ? 'hidden' : 'visible';
  render();
}
function setBattConfig(c) {
  battConfig = c;
  document.getElementById('cBPar').classList.toggle('active-green', c==='parallel');
  document.getElementById('cBSer').classList.toggle('active-green', c==='series');
  render();
}
function setBulb(n) {
  numBulb = n;
  ['l1','l2','l3'].forEach(id => document.getElementById(id).classList.remove('active-purple'));
  document.getElementById('l'+n).classList.add('active-purple');
  document.getElementById('bulbConfigGroup').style.visibility = n === 1 ? 'hidden' : 'visible';
  render();
}
function setBulbConfig(c) {
  bulbConfig = c;
  document.getElementById('cLPar').classList.toggle('active-purple', c==='parallel');
  document.getElementById('cLSer').classList.toggle('active-purple', c==='series');
  render();
}

function getParams() {
  const baseSpeed = 8;
  let speed, numElectrons = 8, ballSize = 6;

  // Ohm's law: I = V / R
  // Voltage: series batteries multiply voltage, parallel keeps same
  // Resistance: series bulbs add resistance (R_total = numBulb * R), parallel bulbs reduce it (R_total = R / numBulb)
  // Current ∝ V / R → speed ∝ voltage / resistance

  const voltage = (numBatt > 1 && battConfig === 'series') ? numBatt : 1;
  let resistance;
  if (numBulb === 1) {
    resistance = 1;
  } else if (bulbConfig === 'series') {
    resistance = numBulb;       // R doubles/triples → current halves/thirds
  } else {
    resistance = 1 / numBulb;  // parallel halves/thirds R → current doubles/triples (capped visually)
  }

  // speed is seconds per lap — higher current = lower speed value (faster)
  speed = baseSpeed * resistance / voltage;
  // cap speed so it doesn't get too fast or too slow
  speed = Math.min(20, Math.max(2, speed));

  // Ball size: series bulbs share energy so each gets less (smaller ball)
  let ballPerBulb = ballSize;
  if (numBulb > 1 && bulbConfig === 'series') {
    ballPerBulb = Math.max(3, ballSize - (numBulb - 1) * 1.5);
  }

  // Build description
  let battDesc = numBatt === 1 ? `<span>1 Battery</span>` :
    `<span>${numBatt} Batteries ${battConfig}</span>`;
  let bulbDesc = numBulb === 1 ? `<span>1 Bulb</span>` :
    `<span>${numBulb} Bulbs ${bulbConfig}</span>`;
  let voltDesc = (numBatt > 1 && battConfig === 'series') ? `Voltage: ${numBatt}×` : `Voltage: 1×`;
  let speedDesc = (numBatt > 1 && battConfig === 'series') ? `electrons move <span>faster</span>` : `electrons move at normal speed`;
  const current = (voltage / resistance).toFixed(2);
  let bulbEffect = numBulb === 1 ? `full brightness` :
    bulbConfig === 'series' ? `resistance ${numBulb}× → current <span>${(1/numBulb*100).toFixed(0)}%</span> → electrons slower, bulbs dimmer` :
    `resistance ÷${numBulb} → current <span>${numBulb}×</span> → electrons faster, bulbs same brightness`;

  return {
    speed, numElectrons, ballSize: ballPerBulb,
    desc: `${battDesc} + ${bulbDesc} — ${voltDesc} | ${speedDesc} | ${bulbEffect}`
  };
}

// ── SVG helpers ──────────────────────────────────────────────────

function electronEl(begin, speed, bSize, disappearZones) {
  // disappearZones: array of {start, end} keyPoint ranges where ball is gone
  // Build opacity keyTimes/values from zones (sorted)
  // Default: ball present everywhere except in disappear zones
  let kts = [0], vals = [1];
  disappearZones.sort((a,b) => a.start - b.start).forEach(z => {
    kts.push(+(z.start - 0.005).toFixed(4), +(z.start + 0.005).toFixed(4));
    kts.push(+(z.end - 0.005).toFixed(4),   +(z.end + 0.005).toFixed(4));
    vals.push(1, 0, 0, 1);
  });
  kts.push(1); vals.push(1);
  // clamp
  kts = kts.map(k => Math.min(1, Math.max(0, k)));

  return `<g>
    <animateMotion dur="${speed}s" repeatCount="indefinite" calcMode="linear" begin="${begin}s"><mpath href="#ep"/></animateMotion>
    <ellipse rx="11" ry="9" cy="2" fill="#555"/>
    <circle cy="-12" r="8" fill="#8B5E3C"/>
    <circle cx="13" cy="-5" r="${bSize}" fill="#f97316" stroke="#c2500a" stroke-width="0.8">
      <animate attributeName="opacity" values="${vals.join(';')}" keyTimes="${kts.join(';')}" dur="${speed}s" repeatCount="indefinite" begin="${begin}s"/>
    </circle>
  </g>`;
}

function batteryStudent(x, y, delay, speed) {
  return `<g transform="translate(${x},${y})">
    <ellipse rx="14" ry="11" cy="2" fill="#3a9c5a"/>
    <circle cy="-15" r="9" fill="#5a7a4a"/>
    <line x1="0" y1="-5" x2="-18" y2="-2" stroke="#3a9c5a" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 0 -5;-20 0 -5;0 0 -5" dur="1s" repeatCount="indefinite" begin="${-delay}s"/>
    </line>
    <circle cx="-22" cy="-3" r="7" fill="#f97316" stroke="#c2500a" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite" begin="${-delay}s"/>
    </circle>
    <text dy="30" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#3a9c5a" font-weight="600">+energy</text>
  </g>`;
}

function batteryStudentSmall(x, y, activeOffset, totalBatteries, speed) {
  const electronInterval = speed / 8;
  const cycleDur = electronInterval * totalBatteries;
  const activeStart = (activeOffset / totalBatteries).toFixed(3);
  const activeEnd = ((activeOffset + 1) / totalBatteries).toFixed(3);
  const eps = 0.02;
  const kt = [0, Math.max(0, activeStart - eps).toFixed(3), activeStart, activeEnd, Math.min(1, parseFloat(activeEnd) + eps).toFixed(3), 1].join(';');
  return `<g transform="translate(${x},${y})">
    <ellipse rx="10" ry="8" cy="2" fill="#3a9c5a"/>
    <circle cy="-12" r="7" fill="#5a7a4a"/>
    <line x1="0" y1="-4" x2="-14" y2="-1" stroke="#3a9c5a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-17" cy="-2" r="5" fill="#f97316" stroke="#c2500a" stroke-width="0.7">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="${kt}" dur="${cycleDur}s" repeatCount="indefinite"/>
    </circle>
  </g>`;
}

// A bulb student at position (x,y), glowing at rate glowDur, label optional
function bulbStudent(x, y, glowDur, label, ballSize) {
  return `<g transform="translate(${x},${y})">
    <ellipse rx="20" ry="20" cy="-15" fill="#ffe066">
      <animate attributeName="opacity" values="0;0.5;0;0.5;0" dur="${glowDur}s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="16;26;16" dur="${glowDur}s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="16;26;16" dur="${glowDur}s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="14" ry="11" cy="2" fill="#7c5cbf"/>
    <circle cy="-15" r="9" fill="#9b7fe8"/>
    <line x1="0" y1="-5" x2="18" y2="-2" stroke="#7c5cbf" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 0 -5;15 0 -5;0 0 -5" dur="${glowDur}s" repeatCount="indefinite"/>
    </line>
    ${label ? `<text dy="30" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#7c5cbf" font-weight="600">${label}</text>` : ''}
  </g>`;
}

function lightBalls(cx, cy, scale=1) {
  const dirs = [{dx:-35,dy:-35},{dx:-45,dy:0},{dx:-35,dy:35},{dx:0,dy:-42},{dx:0,dy:42}];
  return dirs.map((d,i) => {
    const b = -(i * 1.4/5).toFixed(2);
    const col = i>=3 ? '#ffe066' : '#f97316';
    const str = i>=3 ? '#f97316' : '#c2500a';
    const r = i>=3 ? 4*scale : 5*scale;
    const x2=cx+d.dx, y2=cy+d.dy;
    return `<circle r="${r}" fill="${col}" stroke="${str}" stroke-width="0.6" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.6;1" dur="1.4s" repeatCount="indefinite" begin="${b}s"/>
      <animate attributeName="cx" values="${cx};${(cx+x2)/2};${x2}" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite" begin="${b}s"/>
      <animate attributeName="cy" values="${cy};${(cy+y2)/2};${y2}" keyTimes="0;0.5;1" dur="1.4s" repeatCount="indefinite" begin="${b}s"/>
    </circle>`;
  }).join('');
}

function lightLabel(x, y) {
  return `<text x="${x}" y="${y}" font-family="sans-serif" font-size="10" fill="#f97316" font-weight="600" text-anchor="middle">
    light!<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.65;1" dur="1.4s" repeatCount="indefinite"/>
  </text>`;
}

// ── Main render ──────────────────────────────────────────────────

function render() {
  const { speed, numElectrons, ballSize, desc } = getParams();
  document.getElementById('infoBox').innerHTML = desc;

  // ── Circuit path ──
  // Standard rect: top 120→560 (y=80), right 560 (80→320), bottom 560→120 (y=320), left 120 (320→80)
  // Perimeter = 440+240+440+240 = 1360
  // KeyPoints: top 0→0.3235, right 0.3235→0.5, bottom 0.5→0.8235, left 0.8235→1.0
  // Battery right midpoint kp ≈ 0.4118
  // Left side: kp 0.8235→1.0, left mid (y=200) kp ≈ 0.9118

  // For multiple series bulbs on left side, we need multiple disappear zones
  // For parallel bulbs, we keep one main left-side zone but add a separate parallel branch

  // ── Build disappear zones for electrons ──
  // Battery gives energy at kp ~0.41 (right side mid)
  // Bulb(s) consume at left side
  // Series bulbs: spaced along left side, each takes energy sequentially
  // Parallel bulbs: all at same left side position (conceptually), electrons split

  // Left side kp range: 0.8235 → 1.0 (length = 0.1765, representing 240px)
  // y=200 = midpoint → kp = 0.8235 + 0.5*0.1765 = 0.9118

  let disappearZones = [];
  const battKp = 0.4118; // battery position
  const leftStart = 0.8235, leftEnd = 1.0;

  if (numBulb === 1 || bulbConfig === 'parallel') {
    // One disappear zone: from bulb (left mid) back around to battery
    // Ball gone from kp 0.9118 → (wraps) → 0.4118
    disappearZones.push({ start: 0.9118, end: 1.0 });
    disappearZones.push({ start: 0.0,    end: 0.4118 });
  } else {
    // Series bulbs: evenly spaced on left side
    // Each bulb is at a different kp on left side
    // Ball disappears at first bulb and doesn't reappear until battery
    // (electrons carry no ball between first bulb and battery)
    // Simplification: ball disappears at first series bulb position
    const bulbKps = [];
    for (let i = 0; i < numBulb; i++) {
      bulbKps.push(leftStart + ((i + 0.5) / numBulb) * (leftEnd - leftStart));
    }
    const firstBulbKp = bulbKps[0];
    disappearZones.push({ start: firstBulbKp, end: 1.0 });
    disappearZones.push({ start: 0.0, end: 0.4118 });
  }

  // ── Electrons ──
  let electrons = '';
  for (let i = 0; i < numElectrons; i++) {
    const begin = -(i * speed / numElectrons).toFixed(3);
    electrons += electronEl(begin, speed, ballSize, [...disappearZones]);
  }

  // ── Batteries ──
  let batteries = '';
  const bc = numBatt;
  if (bc === 1) {
    batteries += batteryStudent(568, 200, 0, speed);
  } else if (battConfig === 'series') {
    const ys = bc === 2 ? [170, 230] : [145, 200, 255];
    ys.forEach((y, i) => {
      batteries += batteryStudent(568, y, i * 0.3, speed);
      if (i < ys.length - 1)
        batteries += `<line x1="568" y1="${y+18}" x2="568" y2="${ys[i+1]-20}" stroke="#3a9c5a" stroke-width="2.5" stroke-dasharray="4 3"/>`;
    });
    batteries += `<text x="624" y="205" font-family="sans-serif" font-size="10" fill="#3a9c5a" text-anchor="middle" font-weight="600">series</text>`;
  } else {
    const xs = bc === 2 ? [550, 590] : [535, 568, 601];
    xs.forEach((x, i) => batteries += batteryStudentSmall(x, 200, i, bc, speed));
    batteries += `<line x1="${bc===2?550:535}" y1="182" x2="${bc===2?590:601}" y2="182" stroke="#3a9c5a" stroke-width="2"/>`;
    batteries += `<line x1="${bc===2?550:535}" y1="218" x2="${bc===2?590:601}" y2="218" stroke="#3a9c5a" stroke-width="2"/>`;
    batteries += `<text x="568" y="248" font-family="sans-serif" font-size="10" fill="#3a9c5a" text-anchor="middle" font-weight="600">parallel</text>`;
  }

  // ── Bulbs ──
  // Series bulbs: spaced vertically on left side (stacked, connected in-line)
  // Parallel bulbs: side-by-side with branch wires off the main left wire
  let bulbs = '', flyingBalls = '';
  const glowDur = Math.max(0.5, speed / 16);
  const smallerBall = Math.max(3, ballSize * 0.8);

  if (numBulb === 1) {
    bulbs += bulbStudent(112, 200, glowDur, 'uses energy', ballSize);
    flyingBalls += lightBalls(88, 200) + lightLabel(42, 205);

  } else if (bulbConfig === 'series') {
    // Series: spaced along left side
    // positions: evenly spaced between y=100 and y=300
    const ys = numBulb === 2 ? [155, 245] : [110, 200, 290];
    // connecting wires between bulbs and to circuit corners
    // wire from top-left corner (120,80) down to first bulb
    bulbs += `<line x1="112" y1="80" x2="112" y2="${ys[0]-25}" stroke="#bbb" stroke-width="3"/>`;
    for (let i = 0; i < ys.length; i++) {
      bulbs += bulbStudent(112, ys[i], glowDur, null, ballSize);
      flyingBalls += lightBalls(88, ys[i], 0.85) + lightLabel(40, ys[i]+5);
      if (i < ys.length - 1) {
        bulbs += `<line x1="112" y1="${ys[i]+18}" x2="112" y2="${ys[i+1]-25}" stroke="#bbb" stroke-width="3"/>`;
      }
    }
    // wire from last bulb down to bottom-left corner
    bulbs += `<line x1="112" y1="${ys[ys.length-1]+18}" x2="112" y2="320" stroke="#bbb" stroke-width="3"/>`;
    bulbs += `<text x="58" y="${ys[Math.floor(ys.length/2)]+35}" font-family="sans-serif" font-size="10" fill="#7c5cbf" font-weight="600" text-anchor="middle">series</text>`;

  } else {
    // Parallel bulbs: branch off the left side
    // Main left wire stays, branches go left
    const branchX = 60;
    const ys = numBulb === 2 ? [165, 235] : [140, 200, 260];
    const topY = ys[0], botY = ys[ys.length-1];

    // Vertical bus wires on left side of main circuit and at branch
    bulbs += `<line x1="120" y1="${topY}" x2="120" y2="${botY}" stroke="#bbb" stroke-width="3"/>`;
    bulbs += `<line x1="${branchX}" y1="${topY}" x2="${branchX}" y2="${botY}" stroke="#bbb" stroke-width="3"/>`;
    // Top and bottom horizontal connectors
    bulbs += `<line x1="${branchX}" y1="${topY}" x2="120" y2="${topY}" stroke="#bbb" stroke-width="3"/>`;
    bulbs += `<line x1="${branchX}" y1="${botY}" x2="120" y2="${botY}" stroke="#bbb" stroke-width="3"/>`;

    ys.forEach((y, i) => {
      // horizontal branch wire for each bulb
      bulbs += `<line x1="${branchX+14}" y1="${y}" x2="108" y2="${y}" stroke="#bbb" stroke-width="3"/>`;
      bulbs += bulbStudent(branchX, y, glowDur, null, smallerBall);
      flyingBalls += lightBalls(branchX - 24, y, 0.8) + lightLabel(branchX - 46, y + 5);
    });
    bulbs += `<text x="${branchX-10}" y="${ys[Math.floor(ys.length/2)]+35}" font-family="sans-serif" font-size="10" fill="#7c5cbf" font-weight="600" text-anchor="middle">parallel</text>`;
  }

  // ── Legend ──
  const legend = `
    <rect x="258" y="148" width="168" height="100" rx="8" fill="white" fill-opacity="0.9" stroke="#ddd" stroke-width="0.8"/>
    <circle cx="276" cy="168" r="7" fill="#555"/>
    <text x="290" y="172" font-family="sans-serif" font-size="11" fill="#666">= electron</text>
    <rect x="269" y="183" width="13" height="13" rx="3" fill="#3a9c5a"/>
    <text x="290" y="194" font-family="sans-serif" font-size="11" fill="#666">= battery</text>
    <rect x="269" y="202" width="13" height="13" rx="3" fill="#7c5cbf"/>
    <text x="290" y="213" font-family="sans-serif" font-size="11" fill="#666">= light bulb</text>
    <circle cx="276" cy="228" r="6" fill="#f97316" stroke="#c2500a" stroke-width="0.8"/>
    <text x="290" y="232" font-family="sans-serif" font-size="11" fill="#666">= energy (ball)</text>`;

  document.getElementById('svgContainer').innerHTML = `
<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <path id="ep" d="M 120,80 L 560,80 L 560,320 L 120,320 Z"/>
  </defs>

  <!-- Circuit track -->
  <rect x="100" y="60" width="480" height="280" rx="20" fill="none" stroke="#bbb" stroke-width="3" stroke-dasharray="10 7"/>

  <!-- Current arrows -->
  <line x1="250" y1="45" x2="390" y2="45" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
  <text x="320" y="40" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="600" font-family="sans-serif">Current</text>
  <line x1="430" y1="362" x2="290" y2="362" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)" stroke-linecap="round"/>
  <text x="360" y="378" text-anchor="middle" fill="#c0392b" font-size="12" font-weight="600" font-family="sans-serif">Current</text>

  <!-- Battery label -->
  <text x="624" y="168" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500">Battery</text>

  ${legend}
  ${electrons}
  ${batteries}
  ${bulbs}
  ${flyingBalls}

  <text x="360" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600">Electron Shuffle — Circuit Model</text>
</svg>`;
}

// Init
render();
</script>
</body>
</html>
