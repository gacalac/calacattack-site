<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Links — CalacAttack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="./">CalacAttack</a>
      <nav class="nav">
        <a href="tools.html">Tools</a>
        <a href="interactives.html">Interactives</a>
        <a href="links.html" aria-current="page">Links</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">Links</h1>
    <p class="page-sub">Open your assignment or lab document below. Make a copy if your teacher asks you to.</p>
    <div id="linkList"></div>
  </main>

  <footer>CalacAttack · physics resources</footer>

  <script src="site.js"></script>
  <script>

    // ================================================================
    //  ✏️  YOUR LINKS — EDIT THIS LIST TO ADD / UPDATE LINKS
    // ================================================================
    //
    //  HOW TO GET A GOOGLE DOC LINK:
    //    1. Open the doc in Google Docs / Sheets / Slides
    //    2. Click "Share" and set access to "Anyone with the link"
    //       (or your school domain), then "Copy link"
    //    3. Paste that URL into the "url" field below
    //
    //  TIP: to have students get their own copy automatically, change
    //       the end of the link from "/edit..." to "/copy"
    //
    //  FIELDS:
    //    title  — name shown on the link
    //    note   — optional short description (leave it out for none)
    //    group  — optional heading to group links, e.g. "Unit 1: Motion"
    //    url    — the link
    //
    //  TO ADD:     copy one { block }, paste it, fill in your info
    //  TO REMOVE:  delete the whole { block }
    //  TO REORDER: move the { blocks } into the order you want
    //
    // ================================================================

    const links = [

      {
        title: "Lab: Rising and Falling",
        note:  "Uniform accelerated motion, turned on its head...",
        group: "Unit 1: Motion",
        url:   "https://docs.google.com/document/d/1GQbFkL48oDeH5hfuYacxPtuBR_C4v4BSgwW1MHpMUbU/edit?usp=sharing"
      },

      {
        title: "Lab: 2D Motion",
        group: "Unit 1: Motion",
        url:   "https://docs.google.com/document/d/1wS6mfGZSdh6LQh1quZnXwukPwWDI3uR1lALuE5-LP8M/edit?tab=t.0"
      },

    ];

    renderLinks(links, 'linkList');
  </script>

</body>
</html>
