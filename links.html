<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>CalacAttack — Physics Lab Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0f1a;
      --card: #1a1f35;
      --border: #252c4a;
      --accent1: #ffde59;
      --accent2: #ff5e7a;
      --accent3: #3de8c8;
      --accent4: #7b6fff;
      --text: #e8ecff;
      --muted: #6b7299;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(123,111,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123,111,255,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 40px;
      background: rgba(13,15,26,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .nav-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent3);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    main {
      position: relative; z-index: 1;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 64px 24px 80px;
      flex: 1;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 3px;
      color: var(--accent3);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(2.6rem, 7vw, 4.2rem);
      line-height: 1;
      margin-bottom: 16px;
    }

    h1 .yellow { color: var(--accent1); }

    .sub {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .group { margin-bottom: 36px; }

    .group-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .link-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    .link {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s, border-color 0.2s;
    }

    .link:hover, .link:focus-visible {
      transform: translateX(4px);
      border-color: var(--accent3);
      outline: none;
    }

    .link-text { flex: 1; min-width: 0; }
    .link-title { font-weight: 800; font-size: 1.05rem; }
    .link-note { color: var(--muted); font-size: 0.9rem; margin-top: 2px; }

    .link-arrow {
      font-family: 'DM Mono', monospace;
      color: var(--accent3);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .empty {
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 14px;
      text-align: center;
    }

    footer {
      position: relative; z-index: 1;
      text-align: center;
      padding: 28px;
      border-top: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 1px;
    }

    footer span { color: var(--accent1); }

    @media (max-width: 600px) {
      nav { padding: 14px 20px; }
      .nav-tag { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-logo" href="https://calacattack.com/">CalacAttack</a>
    <span class="nav-tag">Physics Labs</span>
  </nav>

  <main>
    <p class="eyebrow">// lab documents</p>
    <h1>Physics <span class="yellow">Labs</span></h1>
    <p class="sub">Open your lab document below. Make a copy if your teacher asks you to.</p>
    <div id="labLinks"></div>
  </main>

  <footer>
    <span>CalacAttack</span> &nbsp;·&nbsp; physics labs
  </footer>

  <script>

    // ================================================================
    //  ✏️  YOUR LAB LINKS — EDIT THIS TO ADD / UPDATE LINKS
    // ================================================================
    //
    //  HOW TO GET A GOOGLE DOC LINK:
    //    1. Open the doc in Google Docs / Sheets / Slides
    //    2. Click "Share" and set access to "Anyone with the link"
    //       (or your school domain), then "Copy link"
    //    3. Paste that URL into the "url" field below
    //
    //  TIP: to have students get their own copy automatically, change
    //       the end of the link from "/edit..." to "/copy"
    //
    //  FIELDS:
    //    title  — name shown on the link
    //    note   — optional short description (use "" for none)
    //    group  — optional heading to group links, e.g. "Unit 1: Motion"
    //    url    — the Google document link
    //
    //  TO ADD A LINK:  copy one { block }, paste it, fill in your info
    //  TO REMOVE:      delete the whole { block } for that link
    //  TO REORDER:     move the { blocks } into the order you want
    //
    // ================================================================

    const labLinks = [

      {
        title: "Sigmund Video Analysis",
        note:  "Use this tool for all video analysis assignments.",
        group: "Tools",
        url:   "sigmund/"   // ← same-site page, no external link needed
      },
      {
        title: "nPlot Graphing",
        note:  "Graph your data, fit curves, and find slopes. Works on iPads.",
        group: "Tools",
        url:   "nplot/"   // ← same-site page, no external link needed
      },
      {
        title: "Lab: Rising and Falling",
        note:  "Uniform accelerated motion, turned on its head...",
        group: "Unit 1: Motion",
        url:   "https://docs.google.com/document/d/1GQbFkL48oDeH5hfuYacxPtuBR_C4v4BSgwW1MHpMUbU/edit?usp=sharing"   // ← paste your Google Doc link here
      },
      {
        title: "Lab: 2D Motion",
        group: "Unit 1: Motion",
        url:   "https://docs.google.com/document/d/1wS6mfGZSdh6LQh1quZnXwukPwWDI3uR1lALuE5-LP8M/edit?tab=t.0"
      },

    ];

    // ================================================================
    //  (no need to edit below this line)
    // ================================================================

    const root = document.getElementById('labLinks');

    if (labLinks.length === 0) {
      root.innerHTML = '<p class="empty">No lab documents posted yet.</p>';
    } else {
      const groups = new Map();
      for (const link of labLinks) {
        const key = link.group || '';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(link);
      }

      for (const [name, links] of groups) {
        const section = document.createElement('section');
        section.className = 'group';

        if (name) {
          const label = document.createElement('h2');
          label.className = 'group-label';
          label.textContent = name;
          section.appendChild(label);
        }

        const list = document.createElement('ul');
        list.className = 'link-list';

        for (const link of links) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.className = 'link';
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener';

          const text = document.createElement('div');
          text.className = 'link-text';
          const title = document.createElement('div');
          title.className = 'link-title';
          title.textContent = link.title;
          text.appendChild(title);
          if (link.note) {
            const note = document.createElement('div');
            note.className = 'link-note';
            note.textContent = link.note;
            text.appendChild(note);
          }

          const arrow = document.createElement('span');
          arrow.className = 'link-arrow';
          arrow.textContent = 'open ↗';

          a.append(text, arrow);
          li.appendChild(a);
          list.appendChild(li);
        }

        section.appendChild(list);
        root.appendChild(section);
      }
    }

  </script>


</body></html>
